<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="prism-grad-1" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="prism-grad-top" x1="25" y1="25" x2="75" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="prism-grad-mid" x1="30" y1="45" x2="65" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="prism-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="100" height="100" rx="24" fill="#0b1120" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g filter="url(#prism-glow)">
    <!-- Main Dynamic 'V' Downward Chevron Vector -->
    <path d="M 24 28 L 50 80 L 76 28 L 62 28 L 50 56 L 38 28 Z" 
          fill="url(#prism-grad-1)"/>

    <!-- 'F' Top Crossbar (Needs 50% Forward Horizon) -->
    <path d="M 33 28 L 76 28 C 78 28 79 30 78 31.5 L 73 40 C 72.2 41.2 71 42 69.5 42 L 39.5 42 Z" 
          fill="url(#prism-grad-top)" opacity="0.95"/>

    <!-- 'F' Mid Crossbar (Wants / Savings Energy Notch) -->
    <path d="M 42 46 L 64 46 C 65.5 46 66.5 47.5 65.8 48.8 L 62 55.5 C 61.2 56.5 60 57 58.8 57 L 47 57 Z" 
          fill="url(#prism-grad-mid)" opacity="0.9"/>
  </g>
</svg>
