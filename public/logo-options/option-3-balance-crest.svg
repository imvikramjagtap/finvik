<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="arc-needs" x1="20" y1="20" x2="80" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="arc-wants" x1="80" y1="30" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="arc-savings" x1="50" y1="80" x2="20" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="center-v-grad" x1="30" y1="35" x2="70" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="crest-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="100" height="100" rx="24" fill="#0b1120" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <g filter="url(#crest-glow)">
    <!-- Segment 1: Needs (50% Upper Arc) - from 180° to 0° (top half) -->
    <path d="M 18 50 A 32 32 0 0 1 82 50" 
          stroke="url(#arc-needs)" stroke-width="10" stroke-linecap="round"/>

    <!-- Segment 2: Wants (30% Lower-Right Arc) -->
    <path d="M 80 58 A 32 32 0 0 1 50 82" 
          stroke="url(#arc-wants)" stroke-width="10" stroke-linecap="round"/>

    <!-- Segment 3: Savings (20% Lower-Left Arc) -->
    <path d="M 42 82 A 32 32 0 0 1 20 62" 
          stroke="url(#arc-savings)" stroke-width="10" stroke-linecap="round"/>

    <!-- Central FinVik 'V' Monogram with Diamond Accent -->
    <path d="M 38 42 L 50 64 L 62 42" 
          stroke="url(#center-v-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central diamond spark (Privacy & Value symbol) -->
    <circle cx="50" cy="38" r="4" fill="#ffffff"/>
  </g>
</svg>
